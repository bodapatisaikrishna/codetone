name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill against the Agent Skills spec
        run: |
          pip install skills-ref
          agentskills validate ./skills/codetone
      - name: Run tests
        run: |
          pip install pytest
          python3 -m pytest tests/ -q
      - name: Check adapters are up to date
        run: |
          python3 scripts/build_adapters.py
          git diff --exit-code -- adapters || {
            echo "adapters/ is out of date. Run: python3 scripts/build_adapters.py"
            exit 1
          }
