name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Validate skill against Agent Skills spec
        run: |
          agentskills validate ./skills/codetone
      - name: Run test suite
        run: |
          SKIP_NETWORK_TESTS=1 python3 -m pytest tests/ -v
      - name: Check adapters are up to date
        run: |
          python3 scripts/build_adapters.py
          git diff --exit-code -- adapters || {
            echo "adapters/ is out of date. Run: python3 scripts/build_adapters.py"
            exit 1
          }
